[project]
name = "ragsystemproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ambika", email = "ambikagupta8899@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.5.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary,pool]>=3.3.6",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ragsystemproject = "ragsystemproject:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.14.0"]
build-backend = "uv_build"

